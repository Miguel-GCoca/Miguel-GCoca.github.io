---
layout: main
---
{% assign projects = site.projects | sort: 'order' %}
{% for project in projects %}
<article class="post">
  {% if project.img %}
    <a class="post-thumbnail" style="background-image: url({{ "/assets/img/" | prepend: site.baseurl | append: project.img }})" href="{{ project.url | prepend: site.baseurl }}"></a>
  {% endif %}
  <div class="post-content">
    <h2 class="post-title"><a href="{{ project.url | prepend: site.baseurl }}">{{ project.title }}</a></h2>
    <p>{{ project.excerpt | strip_html }}</p>
  </div>
</article>
{% endfor %}
