# Site settings
title: "Miguel Grisales Coca"
description: >-
  Portfolio and projects of Miguel Grisales Coca.
permalink: ':title/'
baseurl: ""
url: "https://miguel-gcoca.github.io"

# Author settings
author: Miguel Grisales Coca
author-img: bio-photo.jpg
about-author: "Thanks for stopping by! <br> I'm a robotics and physical AI enthusiast who loves bringing machines to life. I recently graduated and I'm excited to start my career. Stay tuned for what I am cooking up next."
social-github: Miguel-GCoca
social-linkedin: "miguel-grisales5675"
social-email: "MGrisalesCoca@gmail.com"
social-phone: "4076975675"

# Build settings
markdown: kramdown
remote_theme: artemsheludko/flexible-jekyll

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jemoji

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: main
  - scope:
      path: ""
      type: projects
    values:
      layout: main
